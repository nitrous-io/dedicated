# Required
# command - command
description "freighterd"
author      "root"

start on (filesystem and net-device-up)
stop on runlevel [!2345]

env DAEMON=/usr/sbin/freighterd
env HOME=/root

limit nofile 1048576 1048576

# Redirect stdout/stderr to /var/log/upstart/<job>.log
console log

# Automatically respawn.
respawn

script
  exec $DAEMON
end script

pre-start script
  echo "[`date -u +%Y-%m-%dT%T.%3NZ`] (sys) Starting freighterd" >> /var/log/freighterd.log
end script

pre-stop script
  echo "[`date -u +%Y-%m-%dT%T.%3NZ`] (sys) Stopping freighterd" >> /var/log/freighterd.log
end script
