# Required
# command - command
description "hostbuilder"
author      "root"

start on (filesystem and net-device-up)
stop on runlevel [!2345]

limit nofile 50000 50000

# Redirect stdout/stderr to /var/log/upstart/<job>.log
console log

# Automatically respawn.
respawn

# Respawn job up to 10 times within a 5 second period.
# If the job exceeds these values, it'll be stopped and marked as failed.
respawn limit 10 5

script
  exec su -s /bin/bash -c 'hostbuilder -config /etc/hostbuilder/config.json' hostbuilder
end script

pre-start script
  echo "[`date -u +%Y-%m-%dT%T.%3NZ`] (sys) Starting <%= @name %>" >> /var/log/upstart/hostbuilder.log
end script

pre-stop script
  echo "[`date -u +%Y-%m-%dT%T.%3NZ`] (sys) Stopping <%= @name %>" >> /var/log/upstart/hostbuilder.log
end script

post-start script
  status hostbuilder | egrep -oi '([0-9])+$' | head -1 > /var/run/hostbuilder.pid
end script

post-stop script
  rm /var/run/hostbuilder.pid
end script
