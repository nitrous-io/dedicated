# Required
# command - command
description "nitrousd"
author      "root"

start on (filesystem and net-device-up)
stop on runlevel [!2345]

limit nofile 50000 50000

# Redirect stdout/stderr to /var/log/upstart/<job>.log
console log

# Automatically respawn.
respawn

# Prevent spawn flood.
respawn limit 5 30

script
  exec su -s /bin/bash -c 'export $(cat /etc/default/nitrousd) && /opt/nitrousd/nitrousd' nitrousd
end script

pre-start script
  echo "[`date -u +%Y-%m-%dT%T.%3NZ`] (sys) Starting nitrousd" >> /var/log/upstart/nitrousd.log
end script

pre-stop script
  echo "[`date -u +%Y-%m-%dT%T.%3NZ`] (sys) Stopping nitrousd" >> /var/log/upstart/nitrousd.log
end script

post-start script
  status nitrousd | egrep -oi '([0-9]+)$' | head -1 > /var/run/nitrousd.pid
end script

post-stop script
  rm /var/run/nitrousd.pid
end script

