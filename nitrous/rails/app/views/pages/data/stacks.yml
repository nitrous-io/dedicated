ruby-on-rails:
  name: 'Rails'
  about: "Ruby on Rails is an open-source web framework that's optimized for programmer happiness and sustainable productivity. It lets you write beautiful code by favoring convention over configuration."
django:
  name: 'Django'
  about: "Django is a high-level Python Web framework that encourages rapid development and clean, pragmatic design. Built by experienced developers, it takes care of much of the hassle of Web development, so you can focus on writing your app without needing to reinvent the wheel. It’s free and open source."
nodejs:
  name: 'Node.js'
  about: "Node.js is a platform built on Chrome's JavaScript runtime for easily building fast, scalable network applications. Node.js uses an event-driven, non-blocking I/O model that makes it lightweight and efficient, perfect for data-intensive real-time applications that run across distributed devices."
meteor:
  name: 'Meteor'
  about: "Meteor is a complete open source platform for building web and mobile apps in pure JavaScript. Not only is Meteor entirely real-time, but the fact that it uses JavaScript on both the client and server means that you won't have to juggle with multiple languages and environments anymore."
php:
  name: 'PHP'
  about: "PHP (recursive acronym for PHP: Hypertext Preprocessor) is a widely-used open source general-purpose scripting language that is especially suited for web development and can be embedded into HTML."
html5:
  name: 'HTML5'
  about: "HTML5 is a core technology markup language of the Internet used for structuring and presenting content for the World Wide Web."
ruby:
  name: 'Ruby'
  about: "Ruby is a dynamic, open source programming language with a focus on simplicity and productivity. It has an elegant syntax that is natural to read and easy to write."
python:
  name: 'Python'
  about: "Python is a programming language that lets you work more quickly and integrate your systems more effectively. It is powerful, fast, fast, plays well with others, runs everywhere, is friendly & easy to learn, and is Open."
golang:
  name: 'Go'
  about: "The Go programming language is an open source project to make programmers more productive. It's a fast, statically typed, compiled language that feels like a dynamically typed, interpreted language."
java:
  name: 'Java'
  about: "Java is the foundation for virtually every type of networked application and is the global standard for developing and delivering embedded and mobile applications, games, Web-based content, and enterprise software."
wordpress:
  name: 'Wordpress'
  about: "WordPress is web software you can use to create a beautiful website or blog. We like to say that WordPress is both free and priceless at the same time."
iojs:
  name: 'io.js'
  about: "io.js is a JavaScript platform built on Chrome's V8 runtime. This project began as a fork of Joyent's Node.js&trade; and is compatible with the npm ecosystem."
laravel:
  name: 'Laravel'
  about: "Laravel is a free, open source PHP web application framework, designed for the development of model–view–controller (MVC) web applications."
ubuntu:
  name: 'Ubuntu'
  about: "Whether you’re a mobile app developer, an engineering manager, a music or video editor or a financial analyst with large-scale models to run ‐ in fact, anyone in need of a powerful machine for your work ‐ Ubuntu is the ideal platform."
docker:
  name: 'Docker'
  about: "Docker is an open-source project that automates the deployment of applications inside software containers, by providing an additional layer of abstraction and automation of operating-system-level virtualization on Linux."